{% extends "base.html" %}

{% block content %}
<h2>Delete Account</h2>
<p>Are you sure you want to delete "{{ object.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
</form>

<a href="{% url 'accounts_list' %}">Cancel</a>
{% endblock %}
