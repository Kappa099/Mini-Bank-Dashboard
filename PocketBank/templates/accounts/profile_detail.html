{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>My Profile</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="{{ user.userprofile.profile_picture.url }}" 
                 alt="Profile Picture" 
                 style="width:120px; height:120px; border-radius:50%; object-fit:cover; border:3px solid #4A90E2;">
            <div>
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Full name:</strong> {{ user.userprofile.full_name }}</p>
                <p><strong>Phone:</strong> {{ user.userprofile.phone_number }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
            </div>
        </div>
        <div style="margin-top:20px;">
            <a href="{% url 'profile_edit' %}" class="btn btn-primary">Edit Profile</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-primary">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
