{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Edit Profile</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'profile_detail' %}" class="btn btn-outline-primary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
