{% extends "base.html" %}

{% block content %}
<h2>Delete Transaction</h2>
<p>Are you sure you want to delete transaction of ${{ object.amount }} on {{ object.date }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'finance_account_details' object.account.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
