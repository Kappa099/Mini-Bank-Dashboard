{% extends "base.html" %}

{% block content %}
<h2>{% if object %}Edit{% else %}Add{% endif %} Transaction for {{ form.instance.account.name }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
        {% if object %}Update{% else %}Add{% endif %}
    </button>
</form>

<a href="{% url 'finance_transaction_list' pk=account.pk %}">Back to Transactions</a>

{% endblock %}
