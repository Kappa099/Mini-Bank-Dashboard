{% extends "base.html" %}

{% block content %}
<h2>Your Accounts</h2>
<a href="{% url 'account_create' %}" class="btn btn-success">New Account</a>

<ul>
    {% for account in accounts %}
        <li>
            {{ account.name }} - ${{ account.balance }} ({{ account.account_type }})
            <a href="{% url 'finance_account_edit' account.pk %}">Edit</a> |
            <a href="{% url 'finance_account_delete' account.pk %}">Delete</a>
        </li>
    {% empty %}
        <li>No accounts yet.</li>
    {% endfor %}
</ul>
{% endblock %}
