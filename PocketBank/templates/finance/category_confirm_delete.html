{% extends "base.html" %}

{% block content %}
<h2>Delete Account</h2>
<p>Are you sure you want to delete account "{{ object.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'finance_accounts_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
