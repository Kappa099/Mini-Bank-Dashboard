{% extends "base.html" %}
{% block content %}
<h2>Monthly Summary</h2>
<table>
  <tr>
    <th>Month</th>
    <th>Income</th>
    <th>Expense</th>
  </tr>
  {% for month, data in monthly_data.items %}
  <tr>
    <td>{{ month }}</td>
    <td>{{ data.income }}</td>
    <td>{{ data.expense }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="3">No transactions</td></tr>
  {% endfor %}
</table>
{% endblock %}
