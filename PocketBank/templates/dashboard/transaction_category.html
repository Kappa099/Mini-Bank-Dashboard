{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

  <h2>Transaction Categories</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Category</th>
        <th>Total Income</th>
        <th>Total Expense</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td>{{ category.name }}</td>
        <td class="text-success">${{ category.total_income }}</td>
        <td class="text-danger">${{ category.total_expense }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3">No categories found.</td></tr>
      {% endfor %}
    </tbody>
  </table>

</div>
{% endblock %}
